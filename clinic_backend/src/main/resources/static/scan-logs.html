<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nhật ký quét QR lỗi — Lễ tân</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: system-ui, sans-serif; padding: 24px; max-width: 900px; margin: 0 auto; background: #f9fafb; }
        h1 { font-size: 1.5rem; margin-bottom: 20px; color: #0f172a; }
        .card { background: white; border-radius: 16px; padding: 24px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
        .card h2 { font-size: 1rem; color: #64748b; margin-bottom: 12px; }
        input, button { padding: 12px 16px; font-size: 16px; border-radius: 10px; border: 1px solid #e2e8f0; margin-bottom: 8px; }
        button { background: #0d9488; color: white; border: none; cursor: pointer; font-weight: 600; }
        button:hover { background: #0f766e; }
        .log-item { padding: 12px; background: #fef2f2; border-left: 4px solid #dc2626; border-radius: 8px; margin-bottom: 8px; font-size: 14px; }
        .log-item .time { color: #64748b; font-size: 12px; margin-bottom: 4px; }
        .log-item .qr { font-family: monospace; font-size: 12px; color: #475569; word-break: break-all; margin: 4px 0; }
        .log-item .msg { color: #991b1b; font-weight: 500; }
        .hidden { display: none !important; }
        .msg { padding: 12px; border-radius: 8px; margin: 8px 0; }
        .msg.success { background: #d1fae5; color: #065f46; }
        .msg.error { background: #fee2e2; color: #991b1b; }
    </style>
</head>
<body>
    <h1>Nhật ký quét QR lỗi</h1>

    <div class="card" id="loginCard">
        <h2>Đăng nhập (Staff / Lễ tân)</h2>
        <input type="email" id="email" placeholder="Email" value="doctor@clinic.local" style="width:100%;" />
        <input type="password" id="password" placeholder="Mật khẩu" value="doctor123" style="width:100%;" />
        <button onclick="login()">Đăng nhập</button>
    </div>

    <div class="card hidden" id="mainCard">
        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;">
            <h2>Lỗi quét 24h qua</h2>
            <a href="/reception.html" style="color:#0d9488; text-decoration:none; font-weight:500;">← Về Lễ tân</a>
        </div>
        <button onclick="loadLogs()" style="margin-bottom:16px;">Tải lại</button>
        <div id="logList"></div>
        <div id="msg" class="msg hidden"></div>
    </div>

    <script>
        const API = window.location.origin;
        let token = localStorage.getItem('doctor_token');

        if (token) {
            document.getElementById('loginCard').classList.add('hidden');
            document.getElementById('mainCard').classList.remove('hidden');
            loadLogs();
        }

        async function login() {
            const email = document.getElementById('email').value.trim();
            const pass = document.getElementById('password').value;
            try {
                const res = await fetch(API + '/api/auth/staff/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password: pass })
                });
                const data = await res.json();
                if (res.ok && data.token) {
                    token = data.token;
                    localStorage.setItem('doctor_token', token);
                    document.getElementById('loginCard').classList.add('hidden');
                    document.getElementById('mainCard').classList.remove('hidden');
                    loadLogs();
                } else {
                    showMsg('Đăng nhập thất bại', true);
                }
            } catch (e) {
                showMsg('Lỗi: ' + e.message, true);
            }
        }

        async function loadLogs() {
            try {
                const res = await fetch(API + '/api/reception/scan-logs?limit=50', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                if (!res.ok) {
                    if (res.status === 403) {
                        showMsg('Không có quyền xem nhật ký', true);
                        return;
                    }
                    throw new Error(res.status);
                }
                const data = await res.json();
                const items = data.items || [];
                const list = document.getElementById('logList');
                if (items.length === 0) {
                    list.innerHTML = '<p style="color:#64748b;">Không có lỗi quét nào trong 24h qua</p>';
                    return;
                }
                list.innerHTML = items.map(l => {
                    const time = l.createdAt ? new Date(l.createdAt).toLocaleString('vi-VN') : '—';
                    const qr = (l.qrData || '').substring(0, 80) + (l.qrData && l.qrData.length > 80 ? '…' : '');
                    const msg = l.errorMessage || 'Lỗi không xác định';
                    const code = l.statusCode ? ' (' + l.statusCode + ')' : '';
                    return `<div class="log-item">
                        <div class="time">${time}${code}</div>
                        <div class="qr">${escapeHtml(qr) || '—'}</div>
                        <div class="msg">${escapeHtml(msg)}</div>
                    </div>`;
                }).join('');
            } catch (e) {
                document.getElementById('logList').innerHTML = '<p class="msg error">Lỗi: ' + escapeHtml(e.message) + '</p>';
            }
        }

        function escapeHtml(s) {
            if (!s) return '';
            const div = document.createElement('div');
            div.textContent = s;
            return div.innerHTML;
        }

        function showMsg(text, isError) {
            const el = document.getElementById('msg');
            el.textContent = text;
            el.className = 'msg ' + (isError ? 'error' : 'success');
            el.classList.remove('hidden');
        }
    </script>
</body>
</html>
