# Port mặc định 8081. address 0.0.0.0 để điện thoại trên WiFi gọi được IP LAN máy tính.
server:
  port: ${SERVER_PORT:8081}
  address: 0.0.0.0

spring:
  application:
    name: clinic
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: jdbc:postgresql://localhost:5432/phongkham
    username: postgres
    password: ${DB_PASSWORD:01218552666aE@}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
  sql:
    init:
      mode: never
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

app:
  jwt:
    secret: "toothly-dev-jwt-secret-min-32-characters-long!!"
    expiration-ms: 86400000
  otp:
    ttl-minutes: 5
    max-attempts: 5
    register-grace-minutes: 15
  upload:
    dir: uploads
